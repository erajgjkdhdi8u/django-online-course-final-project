<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Online Course{% endblock %} — LearnLab</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {--navy:#11233f;--blue:#4169e1;--muted:#64748b;--bg:#f7f9fd}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--navy)}
    .navbar{background:white;border-bottom:1px solid #e9edf5}
    .brand{font-weight:800;letter-spacing:-.6px;color:var(--navy)!important}
    .brand-mark{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:9px;background:var(--blue);color:white;margin-right:8px;font-size:16px}
    .container-narrow{max-width:1020px;margin:0 auto}
    .eyebrow{color:var(--blue);text-transform:uppercase;font-size:.75rem;font-weight:800;letter-spacing:1.9px}
    .display-heading{font-weight:820;letter-spacing:-1.5px}
    .muted{color:var(--muted)}
    .soft-card{border:1px solid #e7ecf5;box-shadow:0 12px 30px rgba(16,37,72,.035);border-radius:16px}
    .btn-primary{background:#4169e1;border-color:#4169e1}
    .btn-primary:hover{background:#294ecb;border-color:#294ecb}
    .option{border:1px solid #e3e8f2;border-radius:11px;padding:12px 15px;display:block;margin:10px 0;background:white;cursor:pointer}
    .option:has(input:checked){border-color:#4169e1;background:#eff3ff}
    .hero{border-radius:20px;background:linear-gradient(125deg,#0f2345,#294b95);color:white;padding:45px}
    .score-big{font-size:54px;font-weight:800;letter-spacing:-2px}
    .section-title{font-weight:750;letter-spacing:-.3px}
  </style>
</head>
<body>
  <nav class="navbar py-3">
    <div class="container container-narrow d-flex align-items-center justify-content-between">
      <a class="navbar-brand brand" href="{% url 'onlinecourse:index' %}"><span class="brand-mark">L</span>LearnLab</a>
      <div class="d-flex align-items-center gap-3">
        {% if user.is_authenticated %}
          <span class="small muted d-none d-sm-inline">{{ user.username }}</span>
          <form action="{% url 'onlinecourse:logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-secondary btn-sm">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-primary btn-sm" href="{% url 'onlinecourse:login' %}">Sign in</a>
          <a class="btn btn-primary btn-sm" href="{% url 'onlinecourse:registration' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container container-narrow py-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
