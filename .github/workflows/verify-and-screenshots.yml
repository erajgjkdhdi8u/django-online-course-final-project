name: Verify Django and capture Coursera screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DEMO_ADMIN_PASSWORD: "CI-demo-admin-2026!"
      DEMO_STUDENT_PASSWORD: "CI-demo-student-2026!"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate migration and run tests
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test
      - name: Seed a local demo database
        run: |
          python manage.py seed_demo --admin-password "$DEMO_ADMIN_PASSWORD" --student-password "$DEMO_STUDENT_PASSWORD"
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Start Django and capture actual screenshots
        run: |
          (python manage.py runserver --noreload 127.0.0.1:8000 >/tmp/django-server.log 2>&1 &)
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/onlinecourse/ >/dev/null; then break; fi
            sleep 1
          done
          python scripts/capture_screenshots.py
      - name: Upload screenshots as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coursera-screenshots
          path: screenshots/*.png
      - name: Commit genuine screenshots to the public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/03-admin-site.png screenshots/07-final.png
          if ! git diff --cached --quiet; then
            git commit -m "Add verified admin and exam-result screenshots"
            git push
          fi
